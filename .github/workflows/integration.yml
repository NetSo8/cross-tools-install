name: Installation integration

on:
  workflow_dispatch:
    inputs:
      full_pack:
        description: "Installer le manifeste complet au lieu du smoke test"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install smoke pack or full pack
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          manifest="testdata/smoke-tools.json"
          if [[ "${{ inputs.full_pack }}" == "true" ]]; then
            manifest="tools.json"
          fi
          go run ./cmd/cross-tools --manifest "${manifest}" --yes --strict
